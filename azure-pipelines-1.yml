trigger:
  branches:
    include:
      - main
      - stage
      - qa
      - dev
      - uat

pr:
  branches:
    include:
      - main
      - stage
      - qa
      - dev
      - uat

variables:
  vmImageName: 'ubuntu-latest'
  azureServiceConnection: 'Azure subscription 1(525c7c1f-f5e9-4bf4-8d7a-5b7a06889a12)'
  terraformVersion: '1.10.5'
  # Update this if your .tf files are in a subfolder (e.g., '$(System.DefaultWorkingDirectory)/terraform')
  workingDirectory: '$(System.DefaultWorkingDirectory)'

  # 1. Resolve the active branch at runtime (TargetBranch for PRs, SourceBranchName for merges/pushes)
  activeBranch: $[ coalesce(replace(variables['System.PullRequest.TargetBranch'], 'refs/heads/', ''), variables['Build.SourceBranchName']) ]

  # 2. Map 'main' -> 'prod', keeping 'stage', 'qa', 'dev', 'uat' as-is
  envName: $[ replace(variables['activeBranch'], 'main', 'prod') ]

pool:
  vmImage: $(vmImageName)

stages:
- stage: Plan
  displayName: Plan - $(envName)
  jobs:
  - job: Terraform_Plan
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: TerraformTask@5
      displayName: 'Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(azureServiceConnection)'
        backendAzureRmResourceGroupName: 'terraform-deploy'
        backendAzureRmStorageAccountName: 'terraformsflg'
        backendAzureRmContainerName: 'storage-environment'
        backendAzureRmKey: '$(envName).terraform.tfstate'
        backendAzureRmUseAzureAd: true

    - task: TerraformTask@5
      displayName: 'Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        commandOptions: '-var-file=environments/$(envName)/$(envName).tfvars'
        environmentServiceNameAzureRM: '$(azureServiceConnection)'

- stage: Approval
  displayName: Approve Apply - $(envName)
  dependsOn: Plan
  # Skip Approval and Apply on Pull Requests; only run after merge/push
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - job: Manual_Approval
    displayName: 'Approve Terraform Apply ($(envName))'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      timeoutInMinutes: 1440
      inputs:
        notifyUsers: ''
        instructions: 'Review the Terraform Plan output for $(envName), then click Resume to apply or Reject to cancel.'
        onTimeout: 'reject'

- stage: Apply
  displayName: Apply - $(envName)
  dependsOn: Approval
  condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: Terraform_Apply
    environment: '$(envName)'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: TerraformTask@5
            displayName: 'Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: '$(azureServiceConnection)'
              backendAzureRmResourceGroupName: 'terraform-deploy'
              backendAzureRmStorageAccountName: 'terraformsflg'
              backendAzureRmContainerName: 'storage-environment'
              backendAzureRmKey: '$(envName).terraform.tfstate'
              backendAzureRmUseAzureAd: true

          - task: TerraformTask@5
            displayName: 'Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              commandOptions: '-var-file=environments/$(envName)/$(envName).tfvars'
              environmentServiceNameAzureRM: '$(azureServiceConnection)'