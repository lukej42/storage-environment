trigger:
  branches:
    include:
      - main
      - stage
      - qa
      - dev
      - uat

variables:
  vmImageName: 'ubuntu-latest'
  azureServiceConnection: 'Subscription'
  terraformVersion: '1.10.5'
  # Update this if your .tf files are in a subfolder (e.g., '$(System.DefaultWorkingDirectory)/terraform')
  workingDirectory: '$(System.DefaultWorkingDirectory)'

  ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    envName: 'prod'
  ${{ if eq(variables['Build.SourceBranchName'], 'stage') }}:
    envName: 'stage'
  ${{ if eq(variables['Build.SourceBranchName'], 'qa') }}:
    envName: 'qa'
  ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
    envName: 'dev'
  ${{ if eq(variables['Build.SourceBranchName'], 'uat') }}:
    envName: 'uat'
  ${{ if not(in(variables['Build.SourceBranchName'], 'main', 'stage', 'qa', 'dev', 'uat')) }}:
    envName: 'dev'

pool:
  vmImage: $(vmImageName)

stages:
- stage: Plan
  displayName: Plan - $(envName)
  jobs:
  - job: Terraform_Plan
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: AzureCLI@2
      displayName: 'Terraform Init & Plan'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          set -e
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          terraform init \
            -backend-config="storage_account_name=terraformsflg" \
            -backend-config="container_name=storage-environment" \
            -backend-config="key=$(envName).terraform.tfstate" \
            -backend-config="resource_group_name=terraform-deploy" \
            -backend-config="subscription_id=$SUBSCRIPTION_ID" \
            -backend-config="use_azuread_auth=true"

          terraform plan \
            -var-file="environments/$(envName)/terraform.tfvars" \
            -out=tfplan

    - publish: '$(workingDirectory)/tfplan'
      artifact: 'tfplan-$(envName)'
      displayName: 'Publish Terraform Plan'

- stage: Apply
  displayName: Apply - $(envName)
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: Terraform_Apply
    environment: '$(envName)'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - download: current
            artifact: 'tfplan-$(envName)'
            displayName: 'Download Terraform Plan'

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: AzureCLI@2
            displayName: 'Terraform Init & Apply'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              workingDirectory: '$(workingDirectory)'
              inlineScript: |
                set -e
                SUBSCRIPTION_ID=$(az account show --query id -o tsv)

                terraform init \
                  -backend-config="storage_account_name=terraformsflg" \
                  -backend-config="container_name=storage-environment" \
                  -backend-config="key=$(envName).terraform.tfstate" \
                  -backend-config="resource_group_name=terraform-deploy" \
                  -backend-config="subscription_id=$SUBSCRIPTION_ID" \
                  -backend-config="use_azuread_auth=true"

                terraform apply -auto-approve "$(Pipeline.Workspace)/tfplan-$(envName)/tfplan"