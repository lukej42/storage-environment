trigger:
  branches:
    include:
      - main
      - stage
      - qa
      - dev
      - uat

variables:
  vmImageName: 'ubuntu-latest'
  azureServiceConnection: 'Subscription'
  terraformVersion: '1.10.5'
  # Update this if your .tf files are in a subfolder (e.g., '$(System.DefaultWorkingDirectory)/terraform')
  workingDirectory: '$(System.DefaultWorkingDirectory)'

  ${{ if eq(variables['Build.SourceBranchName'], 'main') }}:
    envName: 'prod'
  ${{ if eq(variables['Build.SourceBranchName'], 'stage') }}:
    envName: 'stage'
  ${{ if eq(variables['Build.SourceBranchName'], 'qa') }}:
    envName: 'qa'
  ${{ if eq(variables['Build.SourceBranchName'], 'dev') }}:
    envName: 'dev'
  ${{ if eq(variables['Build.SourceBranchName'], 'uat') }}:
    envName: 'uat'
  ${{ if not(in(variables['Build.SourceBranchName'], 'main', 'stage', 'qa', 'dev', 'uat')) }}:
    envName: 'dev'

pool:
  vmImage: $(vmImageName)

stages:
- stage: Plan
  displayName: Plan - $(envName)
  jobs:
  - job: Terraform_Plan
    steps:
    - task: TerraformInstaller@1
      displayName: 'Install Terraform'
      inputs:
        terraformVersion: '$(terraformVersion)'

    - task: AzureCLI@2
      displayName: 'Set Terraform Auth Variables'
      inputs:
        azureSubscription: $(azureServiceConnection)
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        inlineScript: |
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$servicePrincipalId"
          echo "##vso[task.setvariable variable=ARM_TENANT_ID]$tenantId"
          echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$SUBSCRIPTION_ID"
          if [ -n "$idToken" ]; then
            echo "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]$idToken"
            echo "##vso[task.setvariable variable=ARM_USE_OIDC]true"
          else
            echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
          fi

    - task: TerraformTask@5
      displayName: 'Init'
      inputs:
        provider: 'azurerm'
        command: 'init'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: $(azureServiceConnection)
        backendAzureRmResourceGroupName: 'terraform-deploy'
        backendAzureRmStorageAccountName: 'terraformsflg'
        backendAzureRmContainerName: 'storage-environment'
        backendAzureRmKey: '$(envName).terraform.tfstate'
        backendAzureRmUseAzureAd: true

    - task: TerraformTask@5
      displayName: 'Plan'
      inputs:
        provider: 'azurerm'
        command: 'plan'
        workingDirectory: '$(workingDirectory)'
        commandOptions: '-var-file=environments/$(envName)/terraform.tfvars'
        environmentServiceNameAzureRM: $(azureServiceConnection)

- stage: Apply
  displayName: Apply - $(envName)
  dependsOn: Plan
  condition: succeeded()
  jobs:
  - deployment: Terraform_Apply
    environment: '$(envName)'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: TerraformInstaller@1
            displayName: 'Install Terraform'
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: AzureCLI@2
            displayName: 'Set Terraform Auth Variables'
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: 'bash'
              scriptLocation: 'inlineScript'
              addSpnToEnvironment: true
              inlineScript: |
                SUBSCRIPTION_ID=$(az account show --query id -o tsv)
                echo "##vso[task.setvariable variable=ARM_CLIENT_ID]$servicePrincipalId"
                echo "##vso[task.setvariable variable=ARM_TENANT_ID]$tenantId"
                echo "##vso[task.setvariable variable=ARM_SUBSCRIPTION_ID]$SUBSCRIPTION_ID"
                if [ -n "$idToken" ]; then
                  echo "##vso[task.setvariable variable=ARM_OIDC_TOKEN;issecret=true]$idToken"
                  echo "##vso[task.setvariable variable=ARM_USE_OIDC]true"
                else
                  echo "##vso[task.setvariable variable=ARM_CLIENT_SECRET;issecret=true]$servicePrincipalKey"
                fi

          - task: TerraformTask@5
            displayName: 'Init'
            inputs:
              provider: 'azurerm'
              command: 'init'
              workingDirectory: '$(workingDirectory)'
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: 'terraform-deploy'
              backendAzureRmStorageAccountName: 'terraformsflg'
              backendAzureRmContainerName: 'storage-environment'
              backendAzureRmKey: '$(envName).terraform.tfstate'
              backendAzureRmUseAzureAd: true

          - task: TerraformTask@5
            displayName: 'Apply'
            inputs:
              provider: 'azurerm'
              command: 'apply'
              workingDirectory: '$(workingDirectory)'
              commandOptions: '-var-file=environments/$(envName)/terraform.tfvars'
              environmentServiceNameAzureRM: $(azureServiceConnection)